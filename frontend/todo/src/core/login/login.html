<div class="container">
  <div class="wrapper">
    <h1>todo</h1>
    <form [formGroup]="loginFrom" (ngSubmit)="onSubmit()">
      <div class="form-element">
        <label for="email">Email: </label>
        <input id="email" name="email" type="email" formControlName="email" autocomplete="email" />
      </div>
      <div class="form-element">
        <label for="password">Password: </label>
        <input
          id="password"
          name="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
      </div>
      <button type="submit" [disabled]="!loginFrom.valid">Submit</button>
    </form>
    <div class="sign-in">New user? <a routerLink="/register">Sign up here</a></div>
  </div>
</div>
