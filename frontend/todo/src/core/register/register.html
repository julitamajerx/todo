<div class="container">
  <div class="wrapper">
    <h1>Sign up</h1>
    <form [formGroup]="registerFrom" (ngSubmit)="onSubmit()">
      <div class="form-element">
        <label for="name">Name: </label>
        <input id="name" name="name" type="text" formControlName="name" autocomplete="name" />
      </div>

      <div class="form-element">
        <label for="email">Email: </label>
        <input id="email" name="email" type="email" formControlName="email" autocomplete="email" />
      </div>

      <div class="form-element">
        <label for="password">Password: </label>
        <input
          id="password"
          name="password"
          type="password"
          formControlName="password"
          autocomplete="new-password"
        />
      </div>

      <div class="form-element">
        <label for="avatar">Profile Picture:</label>
        <div class="file-upload-container">
          <button type="button" class="upload-btn" (click)="fileInput.click()">Choose File</button>

          <span class="file-name">
            {{ selectedFileName || 'No file chosen' }}
          </span>

          <input
            #fileInput
            id="avatar"
            name="avatar"
            type="file"
            (change)="onFileSelected($event)"
            accept="image/*"
            style="display: none"
          />
        </div>
      </div>

      <button type="submit" [disabled]="!registerFrom.valid">Submit</button>
    </form>
  </div>
</div>
