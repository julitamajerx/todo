<div class="wrapper">
  <button class="add" (click)="addTags()">✚ Add Tags</button>

  <div class="tags-list">
    @for (tag of tags(); track tag._id) {
      <div class="sidebar-box">
        <input
          type="checkbox"
          class="task-check"
          [checked]="localSelectedTags().includes(tag._id)"
          (change)="onChange(tag._id)"
        />
        <span class="tag-name">{{ tag.emoji }} {{ tag.name }}</span>
      </div>
    }
  </div>
</div>
