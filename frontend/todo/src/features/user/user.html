<div class="wrapper">
  @if (userService.user(); as user) {
    <img class="avatar" [src]="user.avatarUrl || 'default-avatar.png'" [alt]="user.name" priority />

    <div class="info-wrapper">
      <span class="name">{{ user.name }}</span>
      <button class="logout" (click)="userService.logout()">Log Out</button>
    </div>
  } @else {
    <div class="info-wrapper">
      <span class="name">You are not logged in.</span>
    </div>
  }
</div>
