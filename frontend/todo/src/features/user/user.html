<div class="wrapper">
  <img class="avatar" src="avatar.jpg" alt="avatar" />
  <div class="info-wrapper">
    @if (loginService.user(); as user) {
      <span class="name">{{ user.name }}</span>
      <button class="logout" (click)="loginService.logout()">Log Out</button>
    } @else {
      <span class="name">Nie jesteś zalogowany</span>
    }
  </div>
</div>
